<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
  <title id="title">One-hot lookup</title>
  <desc id="desc">The one-hot vector of user 2 is 0, 0, 1, 0, 0. Multiplied by the table of weights, which has one row per user, the single 1 picks the third row: 0.9, -0.3, 0.6, 0.1. This row is the vector of user 2.</desc>
