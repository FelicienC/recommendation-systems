<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
  <title id="title">The likes table</title>
  <desc id="desc">A table with one row per user and one column per film. You and your neighbor liked Scream, Psycho and Evil Dead II. Your neighbor also liked The Shining, which you have not seen, so we recommend it. Someone else only liked Star Wars.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#183a32" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1100" height="400" rx="24" fill="#eaf1ed"/>
  <rect x="24" y="24" width="1052" height="352" rx="20" fill="#ffffff" filter="url(#shadow)"/>
  <g font-family="Avenir Next, Trebuchet MS, sans-serif">
    <text x="58" y="68" fill="#173b36" font-size="23" font-weight="700">Collaborative filtering only looks at who liked what</text>
    <text x="58" y="92" fill="#6b7c76" font-size="13">No genres, no titles: only likes</text>
    <g font-size="14" fill="#6b7c76" text-anchor="middle">
      <text x="305.0" y="136">Scream</text>
      <text x="415.0" y="136">Psycho</text>
      <text x="525.0" y="136">Evil Dead II</text>
      <text x="635.0" y="136">Star Wars</text>
      <text x="745.0" y="136">The Shining</text>
    </g>
    <text x="244" y="176" fill="#167768" font-size="17" font-weight="700" text-anchor="end">You</text>
    <rect x="260" y="150" width="90" height="36" rx="6" fill="#357b6c" stroke="none"/>
    <text x="305.0" y="174" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <rect x="370" y="150" width="90" height="36" rx="6" fill="#357b6c" stroke="none"/>
    <text x="415.0" y="174" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <rect x="480" y="150" width="90" height="36" rx="6" fill="#357b6c" stroke="none"/>
    <text x="525.0" y="174" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <rect x="590" y="150" width="90" height="36" rx="6" fill="#f8faf8" stroke="#dce6e1"/>
    <text x="635.0" y="174" fill="#82908a" font-size="17" font-weight="700" text-anchor="middle">0</text>
    <rect x="700" y="150" width="90" height="36" rx="6" fill="#fff4d6" stroke="#dce6e1"/>
    <text x="745.0" y="174" fill="#9a6b00" font-size="17" font-weight="700" text-anchor="middle">?</text>
    <text x="244" y="220" fill="#173b36" font-size="17" font-weight="700" text-anchor="end">Your neighbor</text>
    <rect x="260" y="194" width="90" height="36" rx="6" fill="#357b6c" stroke="none"/>
    <text x="305.0" y="218" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <rect x="370" y="194" width="90" height="36" rx="6" fill="#357b6c" stroke="none"/>
    <text x="415.0" y="218" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <rect x="480" y="194" width="90" height="36" rx="6" fill="#357b6c" stroke="none"/>
    <text x="525.0" y="218" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <rect x="590" y="194" width="90" height="36" rx="6" fill="#f8faf8" stroke="#dce6e1"/>
    <text x="635.0" y="218" fill="#82908a" font-size="17" font-weight="700" text-anchor="middle">0</text>
    <rect x="700" y="194" width="90" height="36" rx="6" fill="#357b6c" stroke="none"/>
    <text x="745.0" y="218" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <text x="244" y="264" fill="#173b36" font-size="17" font-weight="700" text-anchor="end">Someone else</text>
    <rect x="260" y="238" width="90" height="36" rx="6" fill="#f8faf8" stroke="#dce6e1"/>
    <text x="305.0" y="262" fill="#82908a" font-size="17" font-weight="700" text-anchor="middle">0</text>
    <rect x="370" y="238" width="90" height="36" rx="6" fill="#f8faf8" stroke="#dce6e1"/>
    <text x="415.0" y="262" fill="#82908a" font-size="17" font-weight="700" text-anchor="middle">0</text>
    <rect x="480" y="238" width="90" height="36" rx="6" fill="#f8faf8" stroke="#dce6e1"/>
    <text x="525.0" y="262" fill="#82908a" font-size="17" font-weight="700" text-anchor="middle">0</text>
    <rect x="590" y="238" width="90" height="36" rx="6" fill="#357b6c" stroke="none"/>
    <text x="635.0" y="262" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <rect x="700" y="238" width="90" height="36" rx="6" fill="#f8faf8" stroke="#dce6e1"/>
    <text x="745.0" y="262" fill="#82908a" font-size="17" font-weight="700" text-anchor="middle">0</text>
    <rect x="252" y="142" width="566" height="96" rx="10" fill="none" stroke="#167768" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="840" y="176" fill="#6b7c76" font-size="15">Same likes as you:</text>
    <text x="840" y="198" fill="#6b7c76" font-size="15">a neighbor.</text>
    <text x="58" y="330" fill="#173b36" font-size="16">A row is what a user liked. A 1 means a like, a 0 means no like (or not seen).</text>
    <text x="58" y="358" fill="#167768" font-size="16">Your neighbor liked The Shining, and you have not seen it yet: let's recommend it!</text>
  </g>
</svg>
