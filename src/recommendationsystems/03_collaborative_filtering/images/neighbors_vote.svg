<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
  <title id="title">Neighbors vote</title>
  <desc id="desc">Three neighbors with similarities 0.47, 0.35 and 0.10 vote for the films they liked. The Shining gets 0.47 + 0.35 = 0.82, Fargo 0.47 + 0.10 = 0.57, Star Wars 0.35 + 0.10 = 0.45.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#183a32" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1100" height="380" rx="24" fill="#eaf1ed"/>
  <rect x="24" y="24" width="1052" height="332" rx="20" fill="#ffffff" filter="url(#shadow)"/>
  <g font-family="Avenir Next, Trebuchet MS, sans-serif">
    <text x="58" y="68" fill="#173b36" font-size="23" font-weight="700">Your neighbors vote, and the closest ones count more</text>
    <text x="58" y="92" fill="#6b7c76" font-size="13">Score of a film = sum of the similarities of the neighbors who liked it</text>
    <g font-size="14" fill="#6b7c76" text-anchor="middle">
      <text x="345.0" y="136">The Shining</text>
      <text x="455.0" y="136">Star Wars</text>
      <text x="565.0" y="136">Fargo</text>
    </g>
    <text x="284" y="176" fill="#173b36" font-size="17" font-weight="700" text-anchor="end">Neighbor 1 (0.47)</text>
    <rect x="300" y="150" width="90" height="36" rx="6" fill="#357b6c" stroke="none"/>
    <text x="345.0" y="174" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <rect x="410" y="150" width="90" height="36" rx="6" fill="#f8faf8" stroke="#dce6e1"/>
    <text x="455.0" y="174" fill="#82908a" font-size="17" font-weight="700" text-anchor="middle">0</text>
    <rect x="520" y="150" width="90" height="36" rx="6" fill="#357b6c" stroke="none"/>
    <text x="565.0" y="174" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <text x="284" y="220" fill="#173b36" font-size="17" font-weight="700" text-anchor="end">Neighbor 2 (0.35)</text>
    <rect x="300" y="194" width="90" height="36" rx="6" fill="#357b6c" stroke="none"/>
    <text x="345.0" y="218" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <rect x="410" y="194" width="90" height="36" rx="6" fill="#357b6c" stroke="none"/>
    <text x="455.0" y="218" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <rect x="520" y="194" width="90" height="36" rx="6" fill="#f8faf8" stroke="#dce6e1"/>
    <text x="565.0" y="218" fill="#82908a" font-size="17" font-weight="700" text-anchor="middle">0</text>
    <text x="284" y="264" fill="#173b36" font-size="17" font-weight="700" text-anchor="end">Neighbor 3 (0.10)</text>
    <rect x="300" y="238" width="90" height="36" rx="6" fill="#f8faf8" stroke="#dce6e1"/>
    <text x="345.0" y="262" fill="#82908a" font-size="17" font-weight="700" text-anchor="middle">0</text>
    <rect x="410" y="238" width="90" height="36" rx="6" fill="#357b6c" stroke="none"/>
    <text x="455.0" y="262" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <rect x="520" y="238" width="90" height="36" rx="6" fill="#357b6c" stroke="none"/>
    <text x="565.0" y="262" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <path d="M 300 290 h 310" stroke="#173b36" stroke-width="2"/>
    <text x="284" y="330" fill="#167768" font-size="19" font-weight="700" text-anchor="end">Score</text>
    <text x="345" y="330" fill="#167768" font-size="19" font-weight="700" text-anchor="middle">0.82</text>
    <text x="455" y="330" fill="#167768" font-size="19" font-weight="700" text-anchor="middle">0.45</text>
    <text x="565" y="330" fill="#167768" font-size="19" font-weight="700" text-anchor="middle">0.57</text>
    <text x="660" y="176" fill="#6b7c76" font-size="15">Each neighbor votes for the films</text>
    <text x="660" y="198" fill="#6b7c76" font-size="15">they liked. A vote weighs as much</text>
    <text x="660" y="220" fill="#6b7c76" font-size="15">as the similarity with you.</text>
    <text x="660" y="270" fill="#173b36" font-size="15">The Shining: 0.47 + 0.35 = 0.82</text>
    <text x="660" y="292" fill="#173b36" font-size="15">Fargo: 0.47 + 0.10 = 0.57</text>
    <text x="660" y="314" fill="#173b36" font-size="15">Star Wars: 0.35 + 0.10 = 0.45</text>
  </g>
</svg>
