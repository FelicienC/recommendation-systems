<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Favorite channel by country</title>
  <desc id="desc">Five compact panels pair each country's flag with its highest group-average channel: United States, Technology; United Kingdom, Cuisine; France, Technology; Germany, Sports; Japan, Technology.</desc>
