    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183a32" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#eaf1ed"/>
  <rect x="24" y="24" width="1152" height="472" rx="20" fill="#ffffff" filter="url(#shadow)"/>
