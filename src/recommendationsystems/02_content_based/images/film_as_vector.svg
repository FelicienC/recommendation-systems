<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
  <title id="title">A film is a row of zeros and ones</title>
  <desc id="desc">Toy Story is tagged Animation, Children's and Comedy. Its genre vector has 19 cells, one per genre, with a 1 in those three cells and a 0 everywhere else.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#183a32" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#357b6c"/>
    </marker>
  </defs>
  <rect width="1100" height="380" rx="24" fill="#eaf1ed"/>
  <rect x="24" y="24" width="1052" height="332" rx="20" fill="#ffffff" filter="url(#shadow)"/>
  <g font-family="Avenir Next, Trebuchet MS, sans-serif">
    <text x="58" y="68" fill="#173b36" font-size="23" font-weight="700">A film is a row of zeros and ones</text>
    <text x="58" y="92" fill="#6b7c76" font-size="13">One cell per genre: 1 if the film has the genre, 0 otherwise</text>

    <rect x="58" y="120" width="200" height="200" rx="12" fill="#f8faf8" stroke="#dce6e1"/>
    <text x="158" y="160" fill="#173b36" font-size="20" font-weight="700" text-anchor="middle">Toy Story</text>
    <g font-size="13" font-weight="700" text-anchor="middle">
