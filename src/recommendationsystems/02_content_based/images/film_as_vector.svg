      <text x="158" y="246" fill="#167768">Children's</text>
      <rect x="88" y="266" width="140" height="30" rx="15" fill="#f8e0d4"/>
      <text x="158" y="286" fill="#167768">Comedy</text>
    </g>

    <path d="M276 240h40" fill="none" stroke="#357b6c" stroke-linecap="round" stroke-width="3" marker-end="url(#arrowhead)"/>

