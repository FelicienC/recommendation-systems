default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]
      - id: check-toml
      - id: check-yaml


  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]

      - id: ty
        name: ty check
        entry: uv run --no-sync ty check
        language: system
        types: [python]

      - id: codespell
        name: codespell
        entry: uv run --no-sync codespell
        language: system
        types: [text]

      - id: deptry
        name: deptry
        entry: uv run --no-sync deptry .
        language: system
        pass_filenames: false

      - id: mkdocs-build
        name: mkdocs build
        entry: uv run --no-sync mkdocs build --strict
        language: system
        pass_filenames: false

      - id: conventional-pre-commit
        name: conventional commit
        entry: uv
        language: system
        stages: [commit-msg]
        args: [run, --no-sync, conventional-pre-commit, feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
